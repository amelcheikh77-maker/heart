<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will you be mine?</title>
  <style>
    body {
      background-color: #fff0f5;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .container {
      margin-top: 50px;
      position: relative;
    }

    .heart {
      position: relative;
      width: 160px;
      height: 140px;
      background: red;
      transform: rotate(-45deg);
      margin: 150px auto 60px;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 160px;
      height: 140px;
      background: red;
      border-radius: 50%;
    }

    .heart::before {
      top: -80px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 80px;
    }

    .message-above {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 25px;
      font-weight: bold;
    }

   

    @keyframes sparkle {
      0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -120px) scale(1.5); opacity: 0; }
    }

    h2 {
      font-size: 26px;
      color: #b30059;
    }

    button {
      background-color: #ff99cc;
      border: none;
      border-radius: 20px;
      padding: 12px 25px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
      color: white;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #ff66a3;
    }

    .threat {
      margin-top: 10px;
      font-size: 16px;
      color: #990000;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="heart"></div>
    <div class="message-above">I love you </div>
    <div class="star"></div>
  </div>

  <h2>Will you be mine, darling? 💕</h2>

  <button onclick="yes()">Yes ❤️</button>
  <button onclick="no()">No 😞</button>

  <div class="threat" id="threat">
يمكنك رفضي اليوم لكني سأحاول كل يوم لأحصل عليك,  
<br>ok my baby girl 💋 .

</div>

  <script>
    function yes() {
      window.location.href = "success.html";
    }

    function no() {
      document.getElementById("threat").style.display = "block";
      
    }
  </script>

</body>
</html>
