<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>🌸 لقد قبلتِ بي!</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(to bottom, #ffccff, #ffe6f0);
      font-family: 'Cairo', sans-serif;
      color: #fff;
      text-align: center;
    }

    h1 {
      margin-top: 15%;
      font-size: 40px;
      color: #ff0080;
      text-shadow: 2px 2px 4px #00000060;
      animation: fadeIn 3s ease-in-out forwards;
    }

    p {
      font-size: 22px;
      color: purple;
      text-shadow: 1px 1px 2px #00000050;
      animation: fadeIn 4s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Bubbles */
    .bubble {
      position: absolute;
      bottom: -100px;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      animation: rise 10s infinite ease-in;
    }

    @keyframes rise {
      0% {
        transform: translateY(0);
        opacity: 0.7;
      }
      100% {
        transform: translateY(-120vh);
        opacity: 0;
      }
    }

    /* Fireworks */
    .firework {
      position: absolute;
      width: 6px;
      height: 6px;
      background: yellow;
      border-radius: 50%;
      animation: explode 1.5s ease-out forwards;
    }

    @keyframes explode {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(4); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>🌹 لقد قبلتِ بي يا أميرتي!</h1>
  <p>من هذه اللحظة، أصبح قلبي ملككِ إلى الأبد 💕<br>
     شكرًا لأنكِ جعلتِ هذا العالم أجمل بوجودكِ فيه... 
     <br> .💋 i love you my baby girl </p>

  <script>
    // Create bubbles
    function createBubble() {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      bubble.style.left = Math.random() * 100 + "vw";
      bubble.style.width = bubble.style.height = Math.random() * 20 + 10 + "px";
      bubble.style.animationDuration = Math.random() * 5 + 5 + "s";
      document.body.appendChild(bubble);

      setTimeout(() => {
        bubble.remove();
      }, 10000);
    }

    setInterval(createBubble, 300);

    // Create fireworks randomly
    function createFirework() {
      const firework = document.createElement('div');
      firework.classList.add('firework');
      firework.style.left = Math.random() * 100 + "vw";
      firework.style.top = Math.random() * 60 + "vh";
      firework.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
      document.body.appendChild(firework);

      setTimeout(() => {
        firework.remove();
      }, 1500);
    }

    setInterval(createFirework, 500);
  </script>

</body>
</html>
